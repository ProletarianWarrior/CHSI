<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,shrink-to-fit=no">
  <meta name="format-detection" content="telephone=no,email=no,address=no">
  <!-- 微信 X5 浏览器兼容 -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="x5-orientation" content="portrait">
  <meta name="x5-fullscreen" content="true">
  <meta name="x5-page-mode" content="app">
  <!-- 微信分享卡片 -->
  <meta property="og:title" content="学信档案">
  <meta property="og:description" content="查看学籍、学历、学位信息(支持研究生)">
  <meta property="og:type" content="website">

  <meta name="wechat-enable-text-zoom" content="false">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <!-- PWA & 移动端 App 桌面图标适配 -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#09b37d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="学信档案">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
